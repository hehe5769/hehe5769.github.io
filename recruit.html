<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メール送信フォーム</title>

    <link rel="stylesheet" href="css/recruit.css">

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/emailjs-com@2.6.4/dist/email.min.js"></script>
</head>

<body class="recruit">
    <header>
        <a href="index.html" class="logo">Jptungri株式会社</a>

        <button class="menu-toggle" id="menu-toggle" aria-label="メニュー開閉">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav>
            <ul id="nav-links">
                <li><a href="index.html">ホーム</a></li>
                <li><a href="companyInfo.html">会社概要</a></li>
                <li><a href="example.html">作品紹介</a></li>
                <li><a href="recruit.html" class="active">お問い合わせ</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>お問い合わせフォーム</h1>
        </div>
    </section>

    <div class="container">
        <form id="contact-form">
            <label for="name">名前</label>
            <input type="text" id="name" name="name" required>

            <label for="email">メール</label>
            <input type="email" id="email" name="email" required>

            <label for="message">メッセージ</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">送信</button>
        </form>
        <p id="status"></p>
    </div>

    <script src="script.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function () {
            emailjs.init({
                publicKey: "_6p4VdkpehfWYdLvz",
            });
        })();
    </script>
    <script>
        // 汉堡菜单开关
        const menuToggle = document.getElementById("menu-toggle");
        const navLinks = document.getElementById("nav-links");

        menuToggle.addEventListener("click", () => {
            menuToggle.classList.toggle("active");
            navLinks.classList.toggle("active");
        });
    </script>
</body>

</html>
